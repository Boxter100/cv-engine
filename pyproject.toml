[project]
name = "cv-engine"
version = "0.1.0"
description = "Local AI engine for generating customized CVs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
cv-engine = "cv_engine.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"